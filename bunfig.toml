# Bun Test Configuration

[test]
smol = true
root = "./test"
# Global test timeout: 30 seconds per test (unit/integration)
# This prevents individual tests from hanging indefinitely
timeout = 5000

# Preload: runs before any test file — clears env vars inherited from the nax harness
preload = ["./test/preload.ts"]

# Exclude nax dogfood feature directories (contain acceptance tests from nax runs, not source tests)
exclude = [".nax/**"]
AGENT = 1

# Coverage — only collected when `--coverage` is passed (e.g. `bun run test:coverage`);
# normal `bun test` runs are unaffected.
#
# `coverageSkipTestFiles` drops `*.test.ts` but NOT `test/helpers/**` or
# `test/preload.ts`, which still get `SF:` records. check-coverage.ts therefore scopes
# both floors to `src/` rather than summing every record.
#
# No `coverageThreshold` here: Bun only enforces it via exit code when the `text`
# reporter is enabled (and outside `--parallel`), and it has neither a per-file ratchet
# nor a missing-file guard. The floors live in scripts/check-coverage.ts, which parses
# coverage/lcov.info.
coverageSkipTestFiles = true
# lcov only. The "text" reporter used to abort the run with `error: An internal error
# occurred (WriteFailed)` whenever stdout was a pipe rather than a TTY; that is fixed
# as of Bun 1.4.0 (re-probed 2026-08-30). It stays off because its per-file table is
# cosmetic here — check-coverage.ts parses coverage/lcov.info and prints the totals.
# For per-file detail, run `bun run test:coverage:list`.
coverageReporter = ["lcov"]
coverageDir = "coverage"