# Bun Test Configuration

[test]
smol = true
root = "./test"
# Global test timeout: 30 seconds per test (unit/integration)
# This prevents individual tests from hanging indefinitely
timeout = 5000

# Preload: runs before any test file — clears env vars inherited from the nax harness
preload = ["./test/preload.ts"]

# Exclude nax dogfood feature directories (contain acceptance tests from nax runs, not source tests)
exclude = [".nax/**"]
AGENT = 1

# Coverage — only collected when `--coverage` is passed (e.g. `bun run test:coverage`);
# normal `bun test` runs are unaffected. Test files themselves are excluded from the
# report. NOTE: Bun 1.3.x computes `coverageThreshold` but does NOT enforce it via exit
# code, so the floor is enforced by scripts/check-coverage.ts (which parses coverage/
# lcov.info), not here.
coverageSkipTestFiles = true
# lcov only. The "text" reporter aborts the run with `error: An internal error
# occurred (WriteFailed)` whenever stdout is a pipe rather than a TTY — every CI
# context, and any local `| head`/`| tail`. Its per-file table was cosmetic;
# check-coverage.ts parses coverage/lcov.info and prints the totals. For per-file
# detail, read coverage/lcov.info directly.
coverageReporter = ["lcov"]
coverageDir = "coverage"