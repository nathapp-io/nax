name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'bin/**'
      - 'flows/**'
      - 'scripts/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'bin/**'
      - 'flows/**'
      - 'scripts/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # 15, not 10: this job absorbed the `typecheck` + `check:all` matrix (#1534),
    # which used to run in parallel under its own 5-minute budget. The work grew
    # while the budget did not, and a timeout here reads like a test failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs first since it's ~1-2s — fail fast before the slower steps below.
      - name: Typecheck
        run: bun run typecheck

      # `check:all` is the single aggregator for every static gate (lint
      # included). Adding a gate to package.json is enough to make CI run it —
      # `check:gate-reachability`, inside `check:all`, fails if one is orphaned.
      - name: Check all
        run: bun run check:all

      - name: Test (unit)
        run: bun test test/unit/ --timeout=60000 --bail

      - name: Test (integration)
        run: bun test test/integration/ --timeout=60000 --bail

      - name: Test (ui)
        run: bun test test/ui/ --timeout=60000 --bail

      # Excluded from `bun run test` by design (scripts/run-tests.ts PHASES) — but the
      # scripted-agent e2e suite is the only end-to-end cover for the story orchestrator,
      # so CI runs it explicitly. ~30s.
      - name: Test (e2e)
        run: bun run test:e2e

      # Enforces the documented 80% floor. Bun collects coverage but does not
      # enforce coverageThreshold via exit code, so scripts/check-coverage.ts
      # parses lcov and fails below the floor. Re-runs test/unit/ (~20s).
      - name: Coverage floor
        run: bun run test:coverage
