name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bunfig.toml'
      - 'bun.lock'
      - 'biome.json'
      - '.github/workflows/**'
      - '.nax/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bunfig.toml'
      - 'bun.lock'
      - 'biome.json'
      - '.github/workflows/**'
      - '.nax/**'

jobs:
  nax:
    name: nax
    runs-on: ubuntu-latest
    # 15, not 10: this job absorbed the `typecheck` + `check:all` matrix (#1534),
    # which used to run in parallel under its own 5-minute budget. The work grew
    # while the budget did not, and a timeout here reads like a test failure.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/nax
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      # P4: the live sandbox suite needs a working bubblewrap. Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor, which makes
      # bwrap fail every command; the sysctl lifts that for this job only.
      # NAX_SANDBOX_REQUIRED (below) turns an unavailable sandbox into a test
      # FAILURE, so the suite cannot pass here by skipping.
      - name: Enable the OS sandbox (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Runs first since it's ~1-2s — fail fast before the slower steps below.
      - name: Typecheck
        run: bun run typecheck

      # `check:all` is the single aggregator for every static gate (lint
      # included). Adding a gate to package.json is enough to make CI run it —
      # `check:gate-reachability`, inside `check:all`, fails if one is orphaned.
      - name: Check all
        run: bun run check:all

      # The release workflow is the only other place `bun run build` runs, and it
      # runs after a tag is already pushed. A bundler resolution failure therefore
      # used to be undiscoverable until the release job died with the tag live
      # (nax#1976 -> v0.82.0-canary.8). `check:bundle-externals` guards the two
      # flags we know about; this step guards the class. It takes ~1s.
      - name: Build
        run: bun run build

      - name: Test (unit)
        run: bun test test/unit/ --timeout=60000 --bail

      - name: Test (integration)
        run: bun test test/integration/ --timeout=60000 --bail
        env:
          NAX_SANDBOX_REQUIRED: "1"

      - name: Test (ui)
        run: bun test test/ui/ --timeout=60000 --bail

      # Excluded from `bun run test` by design (scripts/run-tests.ts PHASES) — but the
      # scripted-agent e2e suite is the only end-to-end cover for the story orchestrator,
      # so CI runs it explicitly. ~30s.
      - name: Test (e2e)
        run: bun run test:e2e

      # Enforces the documented 80% floor over `src/`, aggregate and per file. Bun's
      # own coverageThreshold only exits non-zero with the `text` reporter enabled,
      # and has no per-file ratchet, so scripts/check-coverage.ts parses lcov instead.
      # Re-runs unit + integration + ui in ONE invocation (~55s) — Bun writes a
      # single merged report per invocation and cannot merge across them, so the
      # three steps above cannot be reused for this. It also gates nax-agent's
      # sources: these suites run them, and the nax-agent job has no coverage step.
      - name: Coverage floor
        run: bun run test:coverage

  nax-agent:
    name: nax-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/nax-agent
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Root install: links the workspace and runs nax-ai's `prepare`, which
      # builds the dist/ nax-agent's typecheck resolves @nathapp/nax-ai to.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      # Same as the nax job: the sandbox unit tests probe for a working bwrap.
      - name: Enable the OS sandbox (bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Typecheck
        run: bun run typecheck

      # Biome plus nax's source and test gates run against this package
      # (`bun ../nax/scripts/check-*.ts --package=.`).
      - name: Check all
        run: bun run check:all

      - name: Test (unit)
        run: bun test ./test/unit/ --timeout=60000 --bail

      - name: Test (integration)
        run: bun test ./test/integration/ --timeout=60000 --bail

      # No coverage step: nax's `Coverage floor` step runs these suites with
      # nax's and gates nax-agent's sources (S1-5 plan, Decision 7).

  # The four jobs below are nax-ai's former standalone ci.yml, moved into the
  # monorepo unchanged apart from the job ids/names, a package-scoped
  # working-directory default, and workspace installs at the repo root.

  # Gates that are runtime-independent. Split from the matrix so a lint or type
  # failure reports once rather than twice.
  nax-ai-static:
    name: "nax-ai: lint + typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nax-ai
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint
      # Vitest transpiles via esbuild and does not type-check, so this is the
      # only step that proves the package compiles.
      - run: bun run typecheck

  # The declared compatibility target. This is the leg that catches Bun-only
  # code and imports Node cannot resolve, so it must run the real suite rather
  # than a smoke check.
  nax-ai-test-node:
    name: "nax-ai: test (node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: packages/nax-ai
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: node --version
      - run: bun x vitest --run

  # The primary consumer's runtime. Builds, then imports the built artifact the
  # way an installed consumer would — this is what would catch a broken exports
  # map or files array, which the source-level suite cannot see.
  nax-ai-smoke-bun:
    name: "nax-ai: smoke (bun)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nax-ai
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
      - name: import built package
        run: |
          bun --eval '
            import { createClient, PERMITTED_OAUTH_FLOWS } from "./dist/index.js";

            if (PERMITTED_OAUTH_FLOWS.includes("anthropic")) {
              throw new Error("anthropic must never be a permitted OAuth flow");
            }

            const client = createClient({
              providers: [{
                id: "fake", baseUrl: "https://example.invalid",
                auth: { kind: "api-key", env: "NONE" },
                defaultProtocol: "p",
                models: [{ id: "m", pricing: { input: 1, output: 1, cacheRead: 0, cacheWrite: 0 },
                           contextWindow: 1, supportsTools: false, thinkingLevels: [] }],
              }],
              protocols: { p: { pi: async () => ({
                name: "p",
                async *stream() {
                  yield { type: "text-delta", text: "ok" };
                  yield { type: "usage", usage: { inputTokens: 1, outputTokens: 1 } };
                  yield { type: "done", stopReason: "stop" };
                },
              }) } },
            });

            const model = await client.model("fake", "m");
            const result = await client.complete(model, { messages: [{ role: "user", content: "hi" }] });
            if (result.text !== "ok") throw new Error(`unexpected result: ${result.text}`);
            console.log("smoke ok");
          '

  # Proves the tarball a consumer installs contains what the exports map
  # promises. A files/exports mistake is invisible until publish otherwise.
  nax-ai-pack:
    name: "nax-ai: pack + install"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nax-ai
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
      - run: npm pack
      - name: install the tarball into a clean project and import it
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/packages/nax-ai/nathapp-nax-ai-*.tgz
          node --input-type=module -e '
            import { PERMITTED_OAUTH_FLOWS } from "@nathapp/nax-ai";
            console.log("resolved from registry-shaped install:", PERMITTED_OAUTH_FLOWS.join(", "));
          '
