name: CI

# Documentation-only changes cannot break a gate, so they do not spend a run.
# `paths-ignore` skips only when EVERY changed path matches, so a commit that
# touches both a doc and a source file still runs the full suite. No branch
# protection requires these checks, so a skipped run cannot block a merge.
# The list is repeated rather than shared via a YAML anchor: GitHub Actions does
# not resolve anchors in workflow files.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "ROADMAP.md"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "ROADMAP.md"
      - "README.md"

jobs:
  # Gates that are runtime-independent. Split from the matrix so a lint or type
  # failure reports once rather than twice.
  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Vitest transpiles via esbuild and does not type-check, so this is the
      # only step that proves the package compiles.
      - run: bun run typecheck

  # The declared compatibility target. This is the leg that catches Bun-only
  # code and imports Node cannot resolve, so it must run the real suite rather
  # than a smoke check.
  test-node:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: bun x vitest --run

  # The primary consumer's runtime. Builds, then imports the built artifact the
  # way an installed consumer would — this is what would catch a broken exports
  # map or files array, which the source-level suite cannot see.
  smoke-bun:
    name: smoke (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: import built package
        run: |
          bun --eval '
            import { createClient, PERMITTED_OAUTH_FLOWS } from "./dist/index.js";

            if (PERMITTED_OAUTH_FLOWS.includes("anthropic")) {
              throw new Error("anthropic must never be a permitted OAuth flow");
            }

            const client = createClient({
              providers: [{
                id: "fake", baseUrl: "https://example.invalid",
                auth: { kind: "api-key", env: "NONE" },
                defaultProtocol: "p",
                models: [{ id: "m", pricing: { input: 1, output: 1, cacheRead: 0, cacheWrite: 0 },
                           contextWindow: 1, supportsTools: false, thinkingLevels: [] }],
              }],
              protocols: { p: { pi: async () => ({
                name: "p",
                async *stream() {
                  yield { type: "text-delta", text: "ok" };
                  yield { type: "usage", usage: { inputTokens: 1, outputTokens: 1 } };
                  yield { type: "done", stopReason: "stop" };
                },
              }) } },
            });

            const model = await client.model("fake", "m");
            const result = await client.complete(model, { messages: [{ role: "user", content: "hi" }] });
            if (result.text !== "ok") throw new Error(`unexpected result: ${result.text}`);
            console.log("smoke ok");
          '

  # Proves the tarball a consumer installs contains what the exports map
  # promises. A files/exports mistake is invisible until publish otherwise.
  pack:
    name: pack + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack
      - name: install the tarball into a clean project and import it
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/nathapp-nax-ai-*.tgz
          node --input-type=module -e '
            import { PERMITTED_OAUTH_FLOWS } from "@nathapp/nax-ai";
            console.log("resolved from registry-shaped install:", PERMITTED_OAUTH_FLOWS.join(", "));
          '
